name: claude-review

# Revue de PR par Claude, bornée en coût (voir docs/adr/0019-ai-assisted-workflow.md) :
# - déclenchée à l'ouverture d'une PR prête, au passage draft -> prête, ou par le label
#   `ai-review` (re-revue à la demande) ; jamais à chaque push ;
# - diff seulement, outils en lecture + commentaires, nombre de tours plafonné, timeout ;
# - authentification par Workload Identity Federation (OIDC GitHub) : aucune clé API stockée.
#   Les identifiants (non secrets) sont des variables du dépôt ; sans elles, le job est ignoré.

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
    paths-ignore:
      - "content/**"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: >-
      vars.ANTHROPIC_FEDERATION_RULE_ID != '' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write # échange OIDC -> jeton Anthropic de courte durée
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Tu relis une pull request de ce dépôt. La branche de la PR est déjà extraite.
            Lis d'abord CLAUDE.md et la phase en cours dans PLAN.md (§ 13), puis le diff
            (`gh pr diff`). Ne lis d'autres fichiers que si le diff y fait référence.

            Cherche, par ordre de priorité :
            1. Dérives par rapport aux règles de CLAUDE.md : version non épinglée ou `latest`,
               secret ou clé dans le diff, ressource GCP sans label env=platform-ai-demo,
               PVC / LoadBalancer / IP statique sans ADR, travail d'une phase future,
               appel gcloud hors de la config isolée.
            2. Bugs : Terraform invalide ou destructeur, scripts Bash non idempotents,
               ressources qui survivraient à `make down`.
            3. Incohérences documentation / code (README, ADR, tableau d'avancement).

            Ne commente pas le style ni ce que `make test` vérifie déjà (fmt, validate).
            Un commentaire en ligne par problème réel ; puis un seul commentaire de synthèse
            court (`gh pr comment`) : « RAS » si rien à signaler. Réponds en français.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 12
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"
