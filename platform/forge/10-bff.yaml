apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-bff
  namespace: forge
  labels:
    app.kubernetes.io/name: forge-bff
    app.kubernetes.io/part-of: forge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-bff
        app.kubernetes.io/part-of: forge
    spec:
      serviceAccountName: forge-bff
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: rg.fr-par.scw.cloud/forge/forge-bff:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FORGE_ADDR
              value: ":8080"
            - name: FORGE_NAMESPACE
              value: forge-workloads
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: forge-bff
  namespace: forge
  labels:
    app.kubernetes.io/name: forge-bff
spec:
  selector:
    app.kubernetes.io/name: forge-bff
  ports:
    - name: http
      port: 80
      targetPort: http
