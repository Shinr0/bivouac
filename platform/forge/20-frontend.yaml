apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-frontend
  namespace: forge
  labels:
    app.kubernetes.io/name: forge-frontend
    app.kubernetes.io/part-of: forge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-frontend
        app.kubernetes.io/part-of: forge
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: rg.fr-par.scw.cloud/forge/forge-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: forge-frontend
  namespace: forge
  labels:
    app.kubernetes.io/name: forge-frontend
spec:
  selector:
    app.kubernetes.io/name: forge-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
