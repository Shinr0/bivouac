# Wave 1 — provider Scaleway, functions de composition et ClusterProviderConfig.
# Dépend des CRD installées par l'Application crossplane.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-runtime
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Shinr0/platform-project.git
    targetRevision: main
    path: platform/crossplane/runtime

  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

  # Le provider écrit lui-même son statut et sa révision courante.
  ignoreDifferences:
    - group: pkg.crossplane.io
      kind: Provider
      jsonPointers:
        - /spec/package
