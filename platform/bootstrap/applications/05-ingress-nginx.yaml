# Wave 0 — contrôleur d'ingress. Provisionne un Load Balancer Scaleway
# qui sert de point d'entrée unique pour Forge et ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.12.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          replicaCount: 1
          service:
            annotations:
              # Un seul LB pour tout le cluster, en proxy protocol v2 afin de
              # conserver l'IP client réelle.
              service.beta.kubernetes.io/scw-loadbalancer-proxy-protocol-v2: "true"
              service.beta.kubernetes.io/scw-loadbalancer-type: "LB-S"
          config:
            use-proxy-protocol: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
